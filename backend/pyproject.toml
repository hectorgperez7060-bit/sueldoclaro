[project]
name = "sueldoclaro-backend"
version = "0.1.0"
description = "SUELDOCLARO - liquidación de sueldos Argentina (Ley 27.802 / Decreto 407/2026)"
requires-python = ">=3.12"
# Nota: el target de producción es Python 3.12/3.13 (sección 3 del prompt).
# El dominio (Fase 1) es Python puro y corre también en 3.10+ para desarrollo.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "psycopg[binary]>=3.1",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyjwt>=2.8",
    "argon2-cffi>=23.1",
    "openpyxl>=3.1",
    "python-multipart>=0.0.9",
    "redis>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "mypy>=1.10",
    "ruff>=0.5",
]

[tool.pytest.ini_options]
# El dominio se importa como `domain.*` y el seed como `parametros_seed`.
pythonpath = ["src", "seed"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
